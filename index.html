<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سیستمی دروستکردنی ڕاپۆرتی PDF</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- jsPDF Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen py-10 px-4 text-slate-800 flex justify-center items-center">

    <div class="max-w-xl w-full bg-white shadow-2xl rounded-3xl p-8 border border-slate-100">
        
        <!-- سەردێڕ و بەروار -->
        <div class="text-center mb-6 pb-4 border-b border-slate-100">
            <h1 class="text-xl font-bold text-slate-800 mb-1">سیستمی دروستکردنی ڕاپۆرتی PDF</h1>
            <div id="live-datetime" class="text-xs font-semibold text-indigo-600 bg-indigo-50 py-1.5 px-4 rounded-full inline-block mt-2"></div>
        </div>

        <!-- فۆرمی داخڵکردنی زانیارییەکان -->
        <div class="space-y-4">
            
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">📌 نوسینی پۆینت (Point) *</label>
                    <input type="text" id="pointInput" placeholder="بۆ نموونە: پۆینتی ژمارە ١٢" class="w-full px-3.5 py-2.5 text-sm rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:outline-none transition">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">📊 زانیاری عامود (Column Info)</label>
                    <input type="text" id="columnInput" placeholder="بۆ نموونە: عامودی گشتی" class="w-full px-3.5 py-2.5 text-sm rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:outline-none transition">
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">👤 ژمارەی خاوەن ماڵ *</label>
                    <input type="text" id="ownerInput" placeholder="٠٧٧٠١٢٣٤٥٦٧" class="w-full px-3.5 py-2.5 text-sm rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:outline-none transition">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">📍 لۆکەیشن (بە دەست بنووسە)</label>
                    <input type="text" id="locationInput" placeholder="سلێمانی، سەرچنار..." class="w-full px-3.5 py-2.5 text-sm rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:outline-none transition">
                </div>
            </div>

            <!-- زیادکردنی وێنە -->
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">🖼️ زیادکردنی وێنەکان (چەند وێنەیەک هەڵبژێرە)</label>
                <label class="flex flex-col items-center justify-center border-2 border-dashed border-slate-300 rounded-xl p-4 bg-slate-50 hover:bg-indigo-50/50 cursor-pointer transition">
                    <span class="text-xs font-semibold text-slate-600 mb-1">وێنە بگرە یان هەڵبژێرە لە مۆبایلەکەتەوە</span>
                    <span class="text-[10px] text-slate-400">PNG, JPG, JPEG</span>
                    <input type="file" id="imageInput" accept="image/*" multiple class="hidden">
                </label>
                <div id="imagePreviewContainer" class="grid grid-cols-4 gap-2 mt-2"></div>
            </div>

            <!-- کۆمێنت بە کوردی -->
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">💬 تێبینی یان کۆمێنت بە کوردی:</label>
                <textarea id="commentKurdish" rows="2" placeholder="تێبینییەکەت بە کوردی بنووسە..." oninput="translateToEnglish()" class="w-full px-3.5 py-2 text-sm rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:outline-none transition"></textarea>
            </div>

            <!-- وەرگێڕانی ئینگلیزی -->
            <div>
                <label class="block text-xs font-bold text-indigo-600 mb-1">🌐 وەرگێڕانی ئینگلیزی (دەتوانیت دەستکاری بکەیت):</label>
                <textarea id="commentEnglish" rows="2" placeholder="وەرگێڕانی ئینگلیزی لێرە دەردەکەوێت..." class="w-full px-3.5 py-2 text-sm rounded-xl border border-indigo-200 bg-indigo-50/30 focus:ring-2 focus:ring-indigo-500 focus:outline-none transition"></textarea>
            </div>

            <!-- دوگمەکان -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-2">
                <button type="button" onclick="openPreviewModal()" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-3 px-4 rounded-xl transition duration-200 cursor-pointer text-sm flex items-center justify-center gap-2">
                    👁️ پیشاندانی ڕاپۆرت
                </button>
                <button type="button" onclick="generatePDF()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-xl shadow-lg shadow-indigo-200 transition duration-200 cursor-pointer text-sm flex items-center justify-center gap-2">
                    📥 دابەزاندنی PDF
                </button>
            </div>

        </div>
    </div>

    <!-- مۆداڵی پیشاندانی ڕاپۆرت -->
    <div id="previewModal" class="fixed inset-0 bg-black/60 backdrop-blur-xs hidden z-50 flex justify-center items-center p-4 overflow-y-auto">
        <div class="bg-white rounded-3xl max-w-2xl w-full p-6 relative shadow-2xl max-h-[90vh] overflow-y-auto">
            
            <div class="flex justify-between items-center pb-3 border-b mb-4">
                <h3 class="font-bold text-indigo-600 text-base">پیشاندانی پێشوەختەی ڕاپۆرت</h3>
                <button type="button" onclick="closePreviewModal()" class="text-slate-400 hover:text-slate-600 font-bold text-xl px-2 cursor-pointer">✕</button>
            </div>

            <div class="bg-white p-6 rounded-2xl border border-slate-200 text-slate-800">
                <div class="border-b-2 border-indigo-600 pb-3 mb-4 flex justify-between items-center">
                    <div>
                        <h2 class="text-xl font-bold text-indigo-700">Official Report</h2>
                        <p id="modal-datetime" class="text-xs text-slate-500 mt-1"></p>
                    </div>
                    <span class="text-xs bg-indigo-50 text-indigo-600 px-3 py-1 rounded-full font-semibold">Verified</span>
                </div>

                <div class="grid grid-cols-2 gap-3 mb-4 bg-slate-50 p-3 rounded-xl border border-slate-200 text-xs">
                    <div><strong class="text-indigo-600">Point:</strong> <span id="modal-point">-</span></div>
                    <div><strong class="text-indigo-600">Column Info:</strong> <span id="modal-column">-</span></div>
                    <div><strong class="text-indigo-600">Owner Number:</strong> <span id="modal-owner">-</span></div>
                    <div><strong class="text-indigo-600">Location:</strong> <span id="modal-location">-</span></div>
                </div>

                <div class="mb-4">
                    <h4 class="font-bold text-xs text-slate-700 mb-1 border-b pb-0.5">Comment (English):</h4>
                    <p id="modal-comment" class="text-slate-600 bg-slate-50 p-2.5 rounded-lg text-xs min-h-[40px] whitespace-pre-wrap">-</p>
                </div>

                <div id="modal-images-section" class="hidden">
                    <h4 class="font-bold text-xs text-slate-700 mb-2 border-b pb-0.5">Images:</h4>
                    <div id="modal-images-grid" class="grid grid-cols-2 gap-2"></div>
                </div>
            </div>

            <div class="mt-6 flex gap-3">
                <button type="button" onclick="generatePDF()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-xl text-sm cursor-pointer shadow-md">دابەزاندنی فەرمی PDF</button>
                <button type="button" onclick="closePreviewModal()" class="w-full bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-2.5 rounded-xl text-sm cursor-pointer">داخستن</button>
            </div>

        </div>
    </div>

    <script>
        let selectedImagesData = [];
        let currentFormattedDateTime = "";

        function updateDateTime() {
            const now = new Date();
            const optionsDate = { year: 'numeric', month: 'long', day: 'numeric' };
            const optionsWeekday = { weekday: 'long' };
            const dateStr = now.toLocaleDateString('ku-IQ', optionsDate);
            const dayStr = now.toLocaleDateString('ku-IQ', optionsWeekday);
            const timeStr = now.toLocaleTimeString('en-US');

            currentFormattedDateTime = `Date: ${dateStr} | ${dayStr} | Time: ${timeStr}`;
            document.getElementById('live-datetime').innerText = `بەروار: ${dateStr} | ${dayStr} | کات: ${timeStr}`;
        }
        setInterval(updateDateTime, 1000);
        updateDateTime();

        async function translateToEnglish() {
            const kuText = document.getElementById('commentKurdish').value.trim();
            const engBox = document.getElementById('commentEnglish');
            if (!kuText) { engBox.value = ""; return; }
            try {
                const response = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(kuText)}&langpair=ckb|en`);
                const data = await response.json();
                engBox.value = (data && data.responseData && data.responseData.translatedText) ? data.responseData.translatedText : kuText;
            } catch (error) {
                engBox.value = kuText;
            }
        }

        // وەرگرتن و ئامادەکردنی وێنەکان
        document.getElementById('imageInput').addEventListener('change', function(e) {
            const files = e.target.files;
            const previewContainer = document.getElementById('imagePreviewContainer');
            previewContainer.innerHTML = '';
            selectedImagesData = [];

            if (!files || files.length === 0) return;

            Array.from(files).forEach(file => {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const imgObj = new Image();
                    imgObj.onload = function() {
                        const canvas = document.createElement('canvas');
                        const maxW = 600;
                        let width = imgObj.width;
                        let height = imgObj.height;

                        if (width > maxW) {
                            height = Math.round((height * maxW) / width);
                            width = maxW;
                        }

                        canvas.width = width;
                        canvas.height = height;
                        
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(imgObj, 0, 0, width, height);
                        
                        const resizedBase64 = canvas.toDataURL('image/jpeg', 0.8);
                        selectedImagesData.push({ base64: resizedBase64, width: width, height: height });

                        const img = document.createElement('img');
                        img.src = resizedBase64;
                        img.className = 'w-full h-16 object-cover rounded-lg border border-slate-200';
                        previewContainer.appendChild(img);
                    }
                    imgObj.src = event.target.result;
                }
                reader.readAsDataURL(file);
            });
        });

        function prepareData() {
            const point = document.getElementById('pointInput').value.trim() || '-';
            const column = document.getElementById('columnInput').value.trim() || '-';
            const owner = document.getElementById('ownerInput').value.trim() || '-';
            const location = document.getElementById('locationInput').value.trim() || '-';
            const comment = document.getElementById('commentEnglish').value.trim() || 'No comment provided.';

            document.getElementById('modal-datetime').innerText = currentFormattedDateTime;
            document.getElementById('modal-point').innerText = point;
            document.getElementById('modal-column').innerText = column;
            document.getElementById('modal-owner').innerText = owner;
            document.getElementById('modal-location').innerText = location;
            document.getElementById('modal-comment').innerText = comment;

            const imgSection = document.getElementById('modal-images-section');
            const imgGrid = document.getElementById('modal-images-grid');
            imgGrid.innerHTML = '';

            if (selectedImagesData.length > 0) {
                imgSection.classList.remove('hidden');
                selectedImagesData.forEach(item => {
                    const imageEl = document.createElement('img');
                    imageEl.src = item.base64;
                    imageEl.className = 'w-full h-28 object-cover rounded-lg border border-slate-200';
                    imgGrid.appendChild(imageEl);
                });
            } else {
                imgSection.classList.add('hidden');
            }
        }

        function openPreviewModal() {
            const point = document.getElementById('pointInput').value.trim();
            const owner = document.getElementById('ownerInput').value.trim();
            if (!point && !owner) {
                alert('تکایە بە کەمەوە خانەی پۆینت یان ژمارەی خاوەن ماڵ پڕبکەرەوە!');
                return;
            }
            prepareData();
            document.getElementById('previewModal').classList.remove('hidden');
        }

        function closePreviewModal() {
            document.getElementById('previewModal').classList.add('hidden');
        }

        // دروستکردنی فەرمی PDF ڕاستەوخۆ بە jsPDF (مەحاڵە کێشە دروست بکات)
        function generatePDF() {
            const point = document.getElementById('pointInput').value.trim();
            const column = document.getElementById('columnInput').value.trim();
            const owner = document.getElementById('ownerInput').value.trim();
            const location = document.getElementById('locationInput').value.trim();
            const comment = document.getElementById('commentEnglish').value.trim() || 'No comment provided.';

            if (!point && !owner) {
                alert('تکایە بە کەمەوە خانەی پۆینت یان ژمارەی خاوەن ماڵ پڕبکەرەوە!');
                return;
            }

            closePreviewModal();

            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF('p', 'mm', 'a4');
            
            let y = 15;
            
            // سەرڕوڕی ڕاپۆرت
            pdf.setFont("helvetica", "bold");
            pdf.setFontSize(18);
            pdf.setTextColor(79, 70, 229); // رەنگی ئیندیگۆ
            pdf.text("Official Report", 15, y);

            pdf.setFont("helvetica", "normal");
            pdf.setFontSize(10);
            pdf.setTextColor(100, 100, 100);
            y += 7;
            pdf.text(currentFormattedDateTime, 15, y);

            y += 5;
            pdf.setDrawColor(200, 200, 200);
            pdf.line(15, y, 195, y);

            // زانیارییەکان
            y += 10;
            pdf.setFontSize(11);
            pdf.setTextColor(50, 50, 50);

            pdf.setFont("helvetica", "bold");
            pdf.text("Point:", 15, y);
            pdf.setFont("helvetica", "normal");
            pdf.text(point, 45, y);

            pdf.setFont("helvetica", "bold");
            pdf.text("Column Info:", 110, y);
            pdf.setFont("helvetica", "normal");
            pdf.text(column, 140, y);

            y += 8;
            pdf.setFont("helvetica", "bold");
            pdf.text("Owner Number:", 15, y);
            pdf.setFont("helvetica", "normal");
            pdf.text(owner, 45, y);

            pdf.setFont("helvetica", "bold");
            pdf.text("Location:", 110, y);
            pdf.setFont("helvetica", "normal");
            pdf.text(location, 140, y);

            // کۆمێنت
            y += 15;
            pdf.setFont("helvetica", "bold");
            pdf.text("Comment (English):", 15, y);
            y += 6;
            pdf.setFont("helvetica", "normal");
            const splitComment = pdf.splitTextToSize(comment, 180);
            pdf.text(splitComment, 15, y);
            y += (splitComment.length * 6) + 5;

            // زیادکردنی وێنەکان ئەگەر هەبن
            if (selectedImagesData.length > 0) {
                y += 5;
                pdf.setFont("helvetica", "bold");
                pdf.text("Images:", 15, y);
                y += 8;

                let xPos = 15;
                let imgWidthMax = 85;
                let imgHeightMax = 65;

                selectedImagesData.forEach((imgData, index) => {
                    if (y > 220) { // ئەگەر پەڕەکە پڕبوو، پەڕەیەکی نوێ بکەرەوە
                        pdf.addPage();
                        y = 20;
                    }

                    try {
                        pdf.addImage(imgData.base64, 'JPEG', xPos, y, imgWidthMax, imgHeightMax);
                    } catch (e) {
                        console.log("Image load error", e);
                    }

                    // دابەشکردنی وێنەکان بۆ دوو ستوون لە هەر ڕیگەیەکدا
                    if (index % 2 === 0) {
                        xPos = 110;
                    } else {
                        xPos = 15;
                        y += imgHeightMax + 10;
                    }
                });
            }

            // پاشەکەوتکردنی فایلەکە
            pdf.save(`Report_${point}.pdf`);
        }
    </script>
</body>
</html>
